name: Prueba Binance Data API

on:
  workflow_dispatch:

jobs:
  binance-check:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar requests
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Ejecutar prueba Binance Data API
        run: |
          python -u scripts/binance_data_api_check.py